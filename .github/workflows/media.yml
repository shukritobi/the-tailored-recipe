name: Acquire original product media
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/media.yml'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image validator
        run: python -m pip install Pillow
      - name: Retrieve and verify original images
        shell: python
        run: |
          import re, pathlib, urllib.request, time, csv, io
          from PIL import Image
          source = pathlib.Path('index.html').read_text()
          files = sorted(set(re.findall(r'\d{13}-[a-f0-9]{8}\.webp', source)) | {'1784077550680-7982cad0.webp'})
          target = pathlib.Path('assets')
          target.mkdir(exist_ok=True)
          records = []
          for filename in files:
              url = 'https://img.dessert-store.com/stores/thetailoredrecipe/' + filename
              dest = target / filename
              error = ''
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Referer':'https://thetailoredrecipe.dessert-store.com/'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          data = response.read(15000000)
                      with Image.open(io.BytesIO(data)) as im:
                          im.verify()
                      with Image.open(io.BytesIO(data)) as im:
                          im.load()
                          assert im.format == 'WEBP' and min(im.size) >= 100
                          width,height = im.size
                      dest.write_bytes(data)
                      records.append([filename,'verified',len(data),width,height,''])
                      break
                  except Exception as e:
                      error = str(e)
                      time.sleep(attempt+1)
              else:
                  records.append([filename,'failed',0,0,0,error])
          with open('media-download-log.csv','w',newline='') as f:
              writer = csv.writer(f)
              writer.writerow(['file','status','bytes','width','height','error'])
              writer.writerows(records)
          print('Verified:',sum(r[1]=='verified' for r in records),'of',len(records))
      - name: Commit verified files and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets media-download-log.csv
          if ! git diff --cached --quiet; then
            git commit -m "Acquire validated original TTR media"
            git push
          fi
